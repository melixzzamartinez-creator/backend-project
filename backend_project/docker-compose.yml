version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: backend_project/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:chosen_password@db:5432/tasks_db
      JWT_SECRET: ${JWT_SECRET}
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chosen_password
      POSTGRES_DB: tasks_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: